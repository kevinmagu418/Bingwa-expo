name: Android APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 🏗 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📦 Install dependencies
        run: npm install

      - name: 🛠 Run Expo Prebuild
        run: npx expo prebuild --platform android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://uwznhzeibikianuidkbp.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3em5oemVpYmlraWFudWlka2JwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5MzY1MjMsImV4cCI6MjA4NzUxMjUyM30.XXZH33EwmsptFqQiL3xxzRR68T-mrA6EbI_g3c1J77k' }}

      - name: 🔑 chmod gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: 🚀 Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://uwznhzeibikianuidkbp.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3em5oemVpYmlraWFudWlka2JwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5MzY1MjMsImV4cCI6MjA4NzUxMjUyM30.XXZH33EwmsptFqQiL3xxzRR68T-mrA6EbI_g3c1J77k' }}

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bingwa-shambani-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
